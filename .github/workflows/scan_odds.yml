name: Real-Time Odds Scanner — Ogni 15 Minuti

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Diretta.it Odds Scanner
        run: python scanner.py

      - name: Commit and Push Updated Odds
        run: |
          git config user.name "TeamBetting Bot"
          git config user.email "bot@teambetting.ai"
          git add odds.json
          git diff --staged --quiet || git commit -m "chore(odds): aggiorna quote reali pre-match [skip ci]"
          git push
